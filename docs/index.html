<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent office</title>
  <meta name="description" content="Watch a team of AI agents work, check each other and wait for your OK or No OK.">
  <meta name="theme-color" content="#12332b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ccircle cx='10' cy='12' r='3' fill='%23fff'/%3E%3Ccircle cx='22' cy='12' r='3' fill='%23fff'/%3E%3Crect x='7' y='19' width='18' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="una-pantalla">
  <header class="f-cabecera">
    <div>
      <h1 data-t="titulo">Agent office</h1>
      <p class="f-sub" data-f="sub"></p>
    </div>
    <div class="idiomas" role="group" aria-label="Language">
      <button type="button" class="boton-idioma" data-idioma="en" lang="en" aria-pressed="true">EN</button>
      <button type="button" class="boton-idioma" data-idioma="es" lang="es" aria-pressed="false">ES</button>
    </div>
  </header>

  <main class="flujo" id="flujo">
    <div class="f-lienzo"></div>
    <div class="f-mandos">
      <p class="f-estado" data-f="estado" role="status" aria-live="polite"></p>
      <div class="f-botones">
        <button type="button" class="f-boton f-no" data-f="no"></button>
        <button type="button" class="f-boton f-si" data-f="si"></button>
      </div>
    </div>
  </main>

  <script type="module" src="flujo.js"></script>
</body>
</html>
